<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your Name"><br><br>

        <label>Email</label>
        <input type="email" placeholder="Enter your Email"><br><br>

        <label>Password</label>
        <input type="password" placeholder="Enter your Password"><br><br>

        <label>Date of Birth</label>
        <input type="date" name="dob"><br><br>

        <label>Gender</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        <label>Favorite Programming Languages:</label><br>
        <input type="checkbox" name="Language" value="html"> HTML
        <input type="checkbox" name="Language" value="css"> CSS
        <input type="checkbox" name="Language" value="js"> JS
        <br><br>

        <label>City</label>
        <select name="city">
            <option value="karachi">Karachi</option>
            <option value="lahore">Lahore</option>
            <option value="islamabad">Islamabad</option>
            <option value="peshawar">Peshawar</option>
        </select><br><br>

        <label>About Yourself</label><br>
        <textarea name="about"></textarea><br><br>

        <input type="submit" value="Submit"><br><br>
        <input type="reset" value="Reset">
    </form>
</body>
</html>
