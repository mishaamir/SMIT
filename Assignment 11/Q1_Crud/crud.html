<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch API CRUD Practice</title>
  <link rel="stylesheet" href="crud.css">
</head>
<body>

  <header>
    <h1>Fetch API CRUD Practice</h1>
    <p>GET · POST · PUT · PATCH · DELETE</p>
  </header>

  <main>
    <!-- Add Post form -->
    <section class="panel">
      <h2>Add a new post (POST)</h2>
      <form id="postForm">
        <div class="row">
          <input type="text" id="title" placeholder="Post title" required>
          <input type="number" id="userId" value="1" min="1" required>
        </div>
        <textarea id="body" placeholder="Write post content..." required></textarea>

        <div class="buttons">
          <button type="submit" class="btn orange">Add Post — POST</button>
          <button type="button" id="reloadBtn" class="btn gray">Reload Posts — GET</button>
        </div>
      </form>

      <!-- Status message -->
      <div id="message" class="message"></div>

      <p class="note">
        Practice API: JSONPlaceholder. It returns example responses, but POST/PUT/PATCH/DELETE
        changes are not permanently saved on its server. This page updates the local display
        so you can see each operation.
      </p>
    </section>

    <!-- Posts list -->
    <section class="panel">
      <div class="posts-header">
        <h2>Posts</h2>
        <span id="count"></span>
      </div>
      <div id="posts" class="posts"></div>
    </section>
  </main>

  <script src="crud.js"></script>
</body>
</html>
